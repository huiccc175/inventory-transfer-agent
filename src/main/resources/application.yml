spring:
  application:
    name: inventory-transfer-agent
  datasource:
    url: jdbc:h2:file:./data/transfer;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# 进程启动时捡起 status=executing 的任务，从已落库的步骤继续，不重新解析指令。
# app.crash.after-step 仅用于手动演示崩溃：写成 reserve 时，该步骤结果提交后立刻中断。
# 默认关闭。实验测试会在进程内武装同一个断点，不需要改这个配置。
app:
  recovery:
    enabled: true
  crash:
    after-step: ""

logging:
  level:
    com.warehouse.transfer: INFO
